<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>شجرة أبناء خلف الجمعة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style id="css">
/* Layout: one-screen app — header, tab strip, then a pannable tree canvas (or dashboard pages); detail sheet slides up from the bottom. */
:root{
  --bg:#F3F7FC; --surface:#FFFFFF; --surface2:#E9F1FB; --line:#D2DFEF;
  --ink:#0E2440; --ink2:#46607F; --ink3:#7890AD;
  --accent:#1D5FA8; --accent-ink:#FFFFFF; --deep:#0F2E57; --soft:#D8E7F8;
  --branch:#5D7FA6; --leaf:#FFFFFF; --leaf-line:#8FB0D6;
  --gone:#8A97A8; --warn:#B26A00; --warn-bg:#FFF2DC; --bad:#B42318; --bad-bg:#FDE8E6; --good:#16794B; --good-bg:#E2F5EA;
  --shadow:0 8px 30px rgba(15,46,87,.12);
  --f-display:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1628; --surface:#10213A; --surface2:#152B4A; --line:#22406A;
  --ink:#E6EEF8; --ink2:#A9BCD6; --ink3:#7891B2;
  --accent:#5AA2EE; --accent-ink:#06182E; --deep:#08162A; --soft:#1B3A63;
  --branch:#5F86B5; --leaf:#132A49; --leaf-line:#3D6699;
  --gone:#71819A; --warn:#F2B256; --warn-bg:#3A2A10; --bad:#FF8A80; --bad-bg:#3D1715; --good:#6FD39F; --good-bg:#0F3324;
  --shadow:0 8px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1628; --surface:#10213A; --surface2:#152B4A; --line:#22406A;
  --ink:#E6EEF8; --ink2:#A9BCD6; --ink3:#7891B2;
  --accent:#5AA2EE; --accent-ink:#06182E; --deep:#08162A; --soft:#1B3A63;
  --branch:#5F86B5; --leaf:#132A49; --leaf-line:#3D6699;
  --gone:#71819A; --warn:#F2B256; --warn-bg:#3A2A10; --bad:#FF8A80; --bad-bg:#3D1715; --good:#6FD39F; --good-bg:#0F3324;
  --shadow:0 8px 30px rgba(0,0,0,.4); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;direction:rtl}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}

/* header */
.hdr{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--deep);color:#fff}
.hdr .ttl{min-width:0;flex:1}
.hdr h1{font-family:var(--f-display);font-weight:700;font-size:1.3rem;margin:0;line-height:1.2;text-wrap:balance}
.hdr .sub{font-size:.78rem;color:#A9C4E6;margin-top:2px}
.logo{flex:none;display:grid;place-items:center;min-width:58px;height:46px;padding:0 12px;border-radius:12px;border:1.5px solid #6E9BD1;font-family:var(--f-display);font-size:1.15rem;color:#fff;background:linear-gradient(160deg,#1D5FA8,#0F2E57);letter-spacing:.5px}
.hbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:600}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.on{background:var(--good-bg);color:var(--good)}
.pill.off{background:var(--bad-bg);color:var(--bad)}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:10px;padding:7px 12px;font-size:.85rem}
.hbtn:hover{background:rgba(255,255,255,.18)}

/* brand badge — gold calligraphic emblem */
.brand{display:inline-flex;align-items:center;gap:7px;padding:3px 12px 3px 3px;border-radius:999px;background:linear-gradient(135deg,#2E74C0,#1D5FA8 45%,#0F2E57);color:#fff;border:1.5px solid #6E9BD1;box-shadow:0 2px 8px rgba(15,46,87,.25);direction:rtl;white-space:nowrap}
.brand[data-a]{cursor:pointer}
.brand .em{width:26px;height:26px;flex:none;border-radius:50%;background:#D8E7F8;display:grid;place-items:center}
.brand .em svg{width:18px;height:18px}
.brand .bk{font-size:.68rem;font-weight:600;color:#A9C4E6}
.brand .bn{font-family:var(--f-display);font-weight:700;font-size:.95rem;line-height:1}
.brand.lg{padding:6px 20px 6px 6px;gap:10px}
.brand.lg .em{width:44px;height:44px}.brand.lg .em svg{width:30px;height:30px}
.brand.lg .bk{font-size:.85rem}.brand.lg .bn{font-size:1.3rem}
.rh{font-size:.55em;font-weight:500;opacity:.8;margin-inline-start:4px;white-space:nowrap}
.hdr .ttl .brand{margin-bottom:6px}
/* splash credits */
.cred{margin:16px 0 18px;display:flex;flex-direction:column;gap:10px;text-align:center}
.cred>div{background:var(--surface2);border-radius:14px;padding:10px 12px}
.cred dt{font-size:.75rem;color:var(--ink3);font-weight:600;margin-bottom:2px}
.cred dd{margin:0;font-weight:700;font-size:1rem;line-height:1.6}
.team{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:4px}
.team span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.85rem;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.team button{border:0;background:none;color:var(--bad);padding:0;font-size:1rem;line-height:1}
.team .muted{color:var(--ink3);font-weight:500;font-size:.85rem}
.gate{overflow:auto}
.gcard .gtree{width:64px;height:64px;margin-top:14px;display:block}
.gcard>.brand{margin:0 auto}
.gcard h2 .rh{display:block;margin:4px 0 0;font-size:.55em}

/* tabs */
.tabs{display:flex;gap:4px;padding:8px 16px 0;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--ink2);font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .cnt{background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:0 7px;font-size:.75rem;margin-inline-start:4px}

main{flex:1;min-height:0;position:relative}
.page{height:100%;overflow:auto;padding-block:20px 90px;padding-inline:16px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* tree toolbar */
.tbar{position:absolute;top:12px;inset-inline:12px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;pointer-events:none}
.tbar>*{pointer-events:auto}
.search{position:relative;flex:1;min-width:180px;max-width:360px}
.search input{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.results{position:absolute;top:calc(100% + 6px);inset-inline:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:320px;overflow:auto}
.results button{display:block;width:100%;text-align:start;padding:9px 12px;border:0;background:none;border-bottom:1px solid var(--line)}
.results button:hover{background:var(--surface2)}
.results small{display:block;color:var(--ink3);font-size:.75rem}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.seg button{border:0;background:none;padding:9px 12px;font-size:.85rem;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.zoom{position:absolute;bottom:18px;left:16px;z-index:5;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.zoom button{border:0;background:none;width:42px;height:40px;font-size:1.2rem;color:var(--ink)}
.zoom button+button{border-top:1px solid var(--line)}
.zoom button:hover{background:var(--surface2)}

/* tree canvas */
.vp{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:var(--bg);
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
.vp.drag{cursor:grabbing}
.stage{position:absolute;top:0;left:0;transform-origin:0 0;direction:ltr}
.stage>svg{position:absolute;top:0;left:0;overflow:visible}
.stage path{fill:none;stroke:var(--branch);stroke-width:2;stroke-linejoin:round}
.band{position:absolute;left:0;height:1px;border-top:1px dashed var(--line)}
.band span{position:sticky;left:0;display:inline-block;transform:translateY(-50%);background:var(--bg);color:var(--ink3);font-size:.72rem;font-weight:600;padding:0 8px;margin-left:12px;direction:rtl}
.node{position:absolute;width:100px;height:116px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:10px 6px 14px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;direction:rtl;
  box-shadow:0 2px 6px rgba(15,46,87,.08);transition:transform .15s,box-shadow .15s,border-color .15s}
.node:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(15,46,87,.16);border-color:var(--accent)}
.node>*{flex:none}
.node .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.15rem;color:#fff;background:var(--gc);overflow:hidden;flex:none;box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--gc)}
.node .av img{width:100%;height:100%;object-fit:cover}
.node .av svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.node .nm{font-weight:700;font-size:.95rem;line-height:1.6;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .meta{font-size:.68rem;color:var(--ink3);line-height:1.2;white-space:nowrap}
.node.g0{--gc:#0F2E57}.node.g1{--gc:#163F73}.node.g2{--gc:#1D5FA8}.node.g3{--gc:#2E74C0}.node.g4{--gc:#3F87D0}.node.g5{--gc:#5B9BDB}.node.g6{--gc:#79AEE3}
.node.root{background:var(--deep);border-color:var(--deep);color:#fff}
.node.root .av{background:#fff;color:var(--deep);box-shadow:0 0 0 3px var(--deep),0 0 0 4px #6E9BD1}
.node.root .meta{color:#A9C4E6}
.node.gone .av{filter:grayscale(1);opacity:.75}
.node.gone .nm{color:var(--ink2)}
.node .rip{position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
.node .rip svg{width:13px;height:13px;fill:none;stroke:var(--gone);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.node.rev{border:1.5px dashed var(--warn)}
.node.hit{box-shadow:0 0 0 3px var(--warn-bg),0 0 0 5px var(--warn)}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent),0 12px 24px rgba(29,95,168,.25)}
.node .plus{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:15px;font-weight:700;line-height:1}
.node.root .plus{background:rgba(255,255,255,.15);color:#fff}
.prop{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.prop:last-child{border-bottom:0}
.prop .tx{flex:1;min-width:180px;line-height:1.7}
.prop small{color:var(--ink3)}
.tog{position:absolute;z-index:2;min-width:30px;height:22px;padding:0 7px;border-radius:999px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);font-size:.72rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tog.closed{background:var(--accent);color:var(--accent-ink)}
.tog:hover{background:var(--soft);color:var(--accent)}

/* list view */
.list{max-width:760px;margin:60px auto 0}
.list details{border-inline-start:2px solid var(--line);margin-inline-start:14px;padding-inline-start:10px}
.list summary{list-style:none;cursor:pointer;padding:5px 0;display:flex;gap:8px;align-items:center}
.list summary::-webkit-details-marker{display:none}
.list .nm{background:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 12px;font-weight:600}
.list .nm.gone{color:var(--gone)}
.list .k{color:var(--ink3);font-size:.78rem}
.list .tw{width:16px;color:var(--ink3);font-size:.75rem;transition:transform .15s}
.list details[open]>summary .tw{transform:rotate(-90deg)}

/* sheet */
.sheet{position:fixed;z-index:30;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;width:min(600px,calc(100% - 24px));transform:translate(-50%,0);
  background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;animation:up .22s ease-out}
@keyframes up{from{transform:translate(-50%,24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.sheet .top{display:flex;gap:12px;align-items:center}
.ava{width:52px;height:52px;border-radius:50%;flex:none;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-display);font-size:1.3rem;color:var(--accent);overflow:hidden;border:1.5px solid var(--line)}
.ava img{width:100%;height:100%;object-fit:cover}
.sheet h3{margin:0;font-family:var(--f-display);font-size:1.3rem}
.sheet .fn{color:var(--ink2);font-size:.85rem;line-height:1.6}
.x{margin-inline-start:auto;border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;font-size:1.1rem;flex:none;align-self:flex-start}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.act{display:flex;flex-direction:column;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;font-size:.78rem;color:var(--ink2)}
.act svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.act:hover{background:var(--surface2);color:var(--ink)}
.act.danger svg{stroke:var(--bad)}
.act.on{background:var(--surface2);border-color:var(--gone)}
.act.on svg{stroke:var(--gone)}
@media (max-width:440px){.acts{grid-template-columns:repeat(4,1fr)}.act{font-size:.7rem}}

/* chips */
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:600;background:var(--surface2);color:var(--ink2)}
.chip.alive{background:var(--good-bg);color:var(--good)}
.chip.gone{background:var(--surface2);color:var(--gone)}
.chip.rev{background:var(--warn-bg);color:var(--warn)}

/* modal */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(6,20,40,.5);display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:20px}
.modal h2{margin:0 0 14px;font-family:var(--f-display);font-size:1.3rem}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld label{font-size:.82rem;font-weight:600;color:var(--ink2)}
.fld input,.fld select,.fld textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%}
.fld textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.row2{grid-template-columns:1fr}}
.btns{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:600}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dng{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.8rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:.92rem}
.kv dt{color:var(--ink3)}
.kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.cf{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;margin-bottom:6px}
.cf input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0}
.bigphoto{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:var(--surface2);margin-bottom:12px}

/* gate */
.gate{flex:1;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(circle at 50% 120%,var(--soft),transparent 65%),var(--bg)}
.gcard{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:28px 24px;text-align:center}
.gcard h2{font-family:var(--f-display);font-size:1.6rem;margin:10px 0 4px}
.gcard p{color:var(--ink2);margin:0 0 18px;line-height:1.7}
.code{width:100%;text-align:center;font-size:1.8rem;letter-spacing:.6em;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);direction:ltr;font-variant-numeric:tabular-nums}
.err{color:var(--bad);font-size:.88rem;min-height:1.4em;margin:8px 0}
.closed{background:var(--bad-bg);color:var(--bad);border-radius:14px;padding:14px;line-height:1.8;font-weight:500}
.gtree{width:84px;height:84px;margin:0 auto}

/* dashboard */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h2{margin:0;font-family:var(--f-display);font-size:1.25rem}
.sec-h p{margin:0;color:var(--ink3);font-size:.82rem}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat .l{color:var(--ink2);font-size:.8rem;font-weight:600}
.stat .v{font-family:var(--f-display);font-size:1.9rem;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .s{color:var(--ink3);font-size:.75rem}
.stat.lead{background:var(--deep);border-color:var(--deep);color:#fff}
.stat.lead .l,.stat.lead .s{color:#A9C4E6}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
@media (max-width:400px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{margin:0 0 4px;font-size:1rem}
.card .note{color:var(--ink3);font-size:.78rem;margin:0 0 10px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink3);font-size:11px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent)}
.chart .bar:hover,.chart .bar.hv{fill:var(--deep)}
.chart .area{fill:var(--soft)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2}
.hb{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:.9rem}
.hb .t{height:12px;border-radius:0 4px 4px 0;background:var(--accent);min-width:4px}
.hb .n{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:.8rem}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:5px 9px;border-radius:8px;font-size:.78rem;white-space:nowrap}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:.88rem;min-width:0}
.log li:last-child{border-bottom:0}
.log .ic{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface2);color:var(--accent);font-size:.75rem;font-weight:700}
.log .tx{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.6}
.log time{flex:none;color:var(--ink3);font-size:.75rem}
.empty{color:var(--ink3);font-size:.88rem;padding:10px 0}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{text-align:start;padding:8px;border-bottom:1px solid var(--line)}
.tbl th{color:var(--ink3);font-weight:600;font-size:.78rem}
.tw-wrap{overflow-x:auto}
.switch{display:flex;align-items:center;gap:10px;font-weight:600}

var ALBL={add:'إضافة',edit:'تعديل',delete:'حذف',restore:'استرجاع',photo:'صورة',status:'الحالة',settings:'إعدادات',access:'الدخول',import:'استيراد',restoreAll:'استعادة'};
function last(n){var out=[],d=new Date();for(var i=n-1;i>=0;i--){var x=new Date(d.getTime()-i*864e5);out.push(dayKey(x))}return out}
function shortDay(k){var p=k.split('-');return +p[2]+'/'+(+p[1])}

   +st('إجمالي أفراد الشجرة',A.length,(A.length-alive-gone)+' حالتهم غير محددة',1)+st('الأحياء',alive)+st('رحمهم الله',gone)+st('الفروع الرئيسية',branches,main?'أبناء '+esc(shortName(main)):'')+st('الآباء أصحاب الفروع',parents)
   +st('أُضيفوا هذا الشهر',addsM)+st('عدد التعديلات',edits)+st('عدد الزيارات',vOK,visits?'دخول ناجح برمز العائلة':'غير متاح في هذا العرض')+st('محاولات دخول فاشلة',vBad)+st('بانتظار المراجعة',A.filter(function(m){return m.review}).length)+'</div>';
  // growth
  var days=last(30),base=0,per={};S.audit.forEach(function(a){var k=dayKey(a.t);var delta=a.a==='add'?1:a.a==='delete'?-1:a.a==='restore'?1:a.a==='import'?(parseInt((a.d.match(/\d+/)||[0])[0],10)):0;if(k<days[0])base+=delta;else per[k]=(per[k]||0)+delta});
  var cum=[],run=base;days.forEach(function(k){run+=per[k]||0;cum.push({l:k,v:run})});
  var d14=last(14),ops={};S.audit.forEach(function(a){if(a.a!=='import'&&a.a!=='access'&&a.a!=='settings'){var k=dayKey(a.t);ops[k]=(ops[k]||0)+1}});

  h+='<div class="grid2"><div class="card"><h3>نمو عدد أفراد الشجرة</h3><p class="note">آخر 30 يوماً</p>'+lineChart(cum)+'</div>'

   +'<div class="card"><h3>أكثر الأسماء تكراراً</h3><p class="note">بين الأسماء الحالية في الشجرة</p><div class="hb">'+top.map(function(t){return '<span>'+esc(t[0])+'</span><div class="t" style="width:'+(t[1]/top[0][1]*100)+'%"></div><span class="n">'+t[1]+'</span>'}).join('')+'</div></div>'

function barChart(data,unit){var W=460,H=170,L=26,B=24,mx=Math.max(1,Math.max.apply(null,data.map(function(d){return d.v})));var nice=niceMax(mx);
  var bw=(W-L)/data.length,g='';[0,.5,1].forEach(function(f){var y=H-B-(H-B-10)*f;g+='<line class="grid" x1="'+L+'" x2="'+W+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(nice*f)+'</text>'});
  var bars='';data.forEach(function(d,i){var h=(H-B-10)*d.v/nice,x=W-(i+1)*bw+3;var lbl=shortDay(d.l);
    bars+='<rect class="bar" data-tip="'+lbl+': '+d.v+' '+unit+'" x="'+x+'" y="'+(H-B-h)+'" width="'+(bw-6)+'" height="'+Math.max(h,0)+'" rx="3"/>';
    if(i%3===0)bars+='<text x="'+(x+(bw-6)/2)+'" y="'+(H-6)+'" text-anchor="middle">'+lbl+'</text>'});
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">'+g+bars+'</svg>'}
function niceMax(v){if(v<=4)return 4;var p=Math.pow(10,Math.floor(Math.log10(v)));var n=v/p;return (n<=2?2:n<=5?5:10)*p}
function lineChart(data){var W=460,H=170,L=30,B=24,mn=0,mx=niceMax(Math.max.apply(null,data.map(function(d){return d.v}))||1);
  var n=data.length,dx=(W-L)/(n-1),pts=data.map(function(d,i){return[W-i*dx,H-B-(H-B-10)*(d.v-mn)/(mx-mn)]});
  var g='';[0,.5,1].forEach(function(f){var y=H-B-(H-B-10)*f;g+='<line class="grid" x1="'+L+'" x2="'+W+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(mx*f)+'</text>'});
  var line=pts.map(function(p,i){return(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' ');
  var area=line+' L'+pts[n-1][0]+' '+(H-B)+' L'+pts[0][0]+' '+(H-B)+'Z';
  var lab='';[0,Math.floor(n/2),n-1].forEach(function(i){lab+='<text x="'+pts[i][0]+'" y="'+(H-6)+'" text-anchor="middle">'+shortDay(data[i].l)+'</text>'});
  var hits=pts.map(function(p,i){return '<rect fill="transparent" data-tip="'+shortDay(data[i].l)+': '+data[i].v+' فرداً" x="'+(p[0]-dx/2)+'" y="0" width="'+dx+'" height="'+(H-B)+'"/>'}).join('');
  var e=pts[n-1];
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">'+g+'<path class="area" d="'+area+'"/><path class="ln" d="'+line+'"/><circle cx="'+e[0]+'" cy="'+e[1]+'" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>'+lab+hits+'</svg>'}
function bindTips(){var tip=null;document.querySelectorAll('[data-tip]').forEach(function(el){
  el.addEventListener('pointerenter',function(e){tip=document.createElement('div');tip.className='tip';tip.textContent=el.dataset.tip;document.body.appendChild(tip);el.classList.add('hv')});
  el.addEventListener('pointermove',function(e){if(tip){tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY-34)+'px'}});
  el.addEventListener('pointerleave',function(){if(tip)tip.remove();tip=null;el.classList.remove('hv')})})}
function logList(items){if(!items.length)return '<div class="empty">لا توجد عمليات بعد.</div>';
  return '<ul class="log">'+items.map(function(a){return '<li><span class="ic">'+(ALBL[a.a]||a.a).charAt(0)+'</span><div class="tx"><b>'+(ALBL[a.a]||a.a)+'</b>'+(a.name?' — '+esc(a.name):'')+(a.d?'<br><span style="color:var(--ink2)">'+esc(a.d)+'</span>':'')+'</div><time>'+fmtDate(a.t)+'</time></li>'}).join('')+'</ul>'}

  return '<div class="page"><div class="wrap"><div class="sec-h"><h2>سجل العمليات</h2><p>'+S.audit.length+' عملية مسجلة</p></div><div class="seg" style="box-shadow:none;flex-wrap:wrap;align-self:flex-start">'+f.map(function(k){return '<button data-lf="'+k+'" aria-pressed="'+(logFilter===k)+'">'+(k==='all'?'الكل':ALBL[k])+'</button>'}).join('')+'</div><div class="card">'+logList(items.slice(0,300))+'</div></div></div>'}
app.addEventListener('click',function(e){var b=e.target.closest('[data-lf]');if(b){logFilter=b.dataset.lf;render()}});

/* ---------- settings ---------- */
function settingsHTML(){var a=S.settings.access,open=accessOpen();
  return '<div class="page"><div class="wrap" style="max-width:760px">'
  +'<div class="card"><h3>دخول العائلة</h3><p class="note">الحالة الآن: <span class="pill '+(open?'on':'off')+'">'+(open?'مفتوح':'مغلق')+'</span> — الوقت في الرياض '+riyadhHM()+'</p>'
  +'<div class="btns" style="margin-bottom:14px"><button class="btn pri" data-st="open">فتح الآن</button><button class="btn dng" data-st="close">إغلاق الآن</button></div>'
  +'<label class="switch" style="margin-bottom:12px"><input type="checkbox" id="s_auto"'+(a.mode==='auto'?' checked':'')+'>الفتح والإغلاق تلقائياً حسب الوقت</label>'
  +'<div class="row2"><div class="fld"><label for="s_start">وقت بداية السماح</label><input id="s_start" type="time" value="'+esc(a.start)+'"></div><div class="fld"><label for="s_end">وقت نهاية السماح</label><input id="s_end" type="time" value="'+esc(a.end)+'"></div></div><button class="btn" data-st="time">حفظ الأوقات</button></div>'
  +'<div class="card"><h3>رمز دخول العائلة</h3><p class="note">يُحفظ الرمز مشفّراً (SHA-256). الرمز الافتراضي 0000.</p><form id="codef"><div class="row2"><div class="fld"><label for="s_c1">الرمز الجديد</label><input id="s_c1" type="password" inputmode="numeric" minlength="4" maxlength="12" required></div><div class="fld"><label for="s_c2">تأكيد الرمز</label><input id="s_c2" type="password" inputmode="numeric" maxlength="12" required></div></div><button class="btn pri">تغيير الرمز</button></form></div>'
  +'<div class="card"><h3>الهوية</h3><form id="idf"><div class="row2"><div class="fld"><label for="s_name">اسم التطبيق</label><input id="s_name" maxlength="40" value="'+esc(S.settings.appName)+'"></div><div class="fld"><label for="s_hon">عبارة بخط صغير بعد الاسم</label><input id="s_hon" maxlength="20" value="'+esc(S.settings.honor)+'"></div></div><div class="fld"><label for="s_logo">الاسم في شعار «برمجة»</label><input id="s_logo" maxlength="24" value="'+esc(S.settings.logo)+'"></div><button class="btn pri">حفظ</button></form></div>'
  +'<div class="card"><h3>شاشة البداية</h3><p class="note">تظهر قبل الدخول إلى الشجرة. فريق الإعداد: اسم في كل سطر.</p><form id="crf"><div class="fld"><label for="s_prep">إعداد وجمع (اسم في كل سطر)</label><textarea id="s_prep" style="min-height:64px">'+esc(S.settings.credits.prep)+'</textarea></div><div class="fld"><label for="s_idea">فكرة</label><input id="s_idea" maxlength="60" value="'+esc(S.settings.credits.idea)+'"></div><div class="fld"><label for="s_team">فريق الإعداد</label><textarea id="s_team">'+esc(S.settings.credits.team.join('\n'))+'</textarea></div><button class="btn pri">حفظ</button></form></div>'
  +'<div class="card"><h3>النسخ الاحتياطي والاستعادة</h3><p class="note">النسخة الاحتياطية ملف JSON يحتوي الشجرة والإعدادات والسجل.</p><div class="btns"><button class="btn" data-st="backup">تنزيل نسخة احتياطية</button><button class="btn" data-st="restore">استعادة من ملف</button></div></div>'
  +'</div></div>'}
app.addEventListener('click',function(e){var b=e.target.closest('[data-st]');if(!b)return;var k=b.dataset.st,a=S.settings.access;
  if(k==='open'||k==='close'){a.mode='manual';a.open=k==='open';audit('access',null,k==='open'?'فتح دخول العائلة':'إغلاق دخول العائلة');changed()}
  else if(k==='time'){var s=$('#s_start').value,en=$('#s_end').value;if(!s||!en){toast('حدد الوقتين');return}a.start=s;a.end=en;audit('access',null,'أوقات السماح: '+s+' – '+en);changed()}
  else if(k==='backup')backup();
  else if(k==='restore')restoreFile();});
app.addEventListener('change',function(e){if(e.target.id==='s_auto'){var a=S.settings.access;a.mode=e.target.checked?'auto':'manual';audit('access',null,e.target.checked?'تشغيل الفتح التلقائي':'إيقاف الفتح التلقائي');changed()}});
app.addEventListener('submit',function(e){
  if(e.target.id==='codef'){e.preventDefault();var c1=$('#s_c1').value.trim(),c2=$('#s_c2').value.trim();if(c1.length<4){toast('الرمز 4 خانات على الأقل');return}if(c1!==c2){toast('الرمزان غير متطابقين');return}
    sha(c1).then(function(h){S.settings.codeHash=h;audit('settings',null,'تغيير رمز الدخول');changed();toast('تم تغيير الرمز')})}
  if(e.target.id==='idf'){e.preventDefault();var n=$('#s_name').value.trim(),l=$('#s_logo').value.trim();if(!n||!l)return;S.settings.appName=n;S.settings.logo=l;S.settings.honor=$('#s_hon').value.trim();audit('settings',null,'تحديث اسم التطبيق والشعار');changed()}
  if(e.target.id==='crf'){e.preventDefault();var c=S.settings.credits;c.idea=$('#s_idea').value.trim();c.prep=$('#s_prep').value.split('\n').map(function(x){return x.trim()}).filter(Boolean).join('\n');c.team=$('#s_team').value.split('\n').map(function(x){return x.trim()}).filter(Boolean);audit('settings',null,'تحديث شاشة البداية');changed();toast('تم التحديث')}});
function backup(){var data=JSON.stringify(S,null,1);var fn='aljumah-tree-backup-'+dayKey(Date.now())+'.json';
  if(!caps.downloads){toast('التنزيل غير متاح في هذا العرض');return}
  caps.downloads.save({filename:fn,data:new Blob([data],{type:'application/json'})}).then(function(){toast('تم تجهيز النسخة')}).catch(function(e){if(e&&e.code!=='declined')toast('تعذر التنزيل')})}
function restoreFile(){var inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';
  inp.onchange=function(){var f=inp.files[0];if(!f)return;f.text().then(function(t){var d;try{d=JSON.parse(t)}catch(_){toast('الملف غير صالح');return}
    if(!d||!Array.isArray(d.members)||!d.settings){toast('الملف لا يحتوي شجرة صالحة');return}
    modal('<h2>استعادة النسخة؟</h2><p style="line-height:1.8">ستستبدل الشجرة الحالية بنسخة تحتوي '+d.members.length+' اسماً.</p><div class="btns"><button class="btn dng" id="cr">استعادة</button><button class="btn" data-close>إلغاء</button></div>',function(s,close){
      s.querySelector('#cr').onclick=function(){S=d;S.audit=S.audit||[];reindex();audit('restoreAll',null,'استعادة من نسخة احتياطية');close();changed()}})})};inp.click()}

boot();
})();
</script>
